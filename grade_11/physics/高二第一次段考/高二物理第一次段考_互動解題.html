<script>
const DATA=[{"question": {"number": 1, "type": "single_choice", "source_page": 1, "source_image": "段考1-01.jpg", "stem": "欲了解聲波如何在金屬中傳播，可利用簡化的一維模型：將金屬原子視為質量 m 的小球，以間距 d 排列成一直線，且相鄰兩個小球間以彈性常數 k 的彈簧連結，藉以模擬原子間的作用力。在此簡化模型的假設下，應用因次分析來判定，下列何者可能為金屬中的聲速？", "choices": {"A": "d√(k/m)", "B": "d√(mk)", "C": "√(dm/k)", "D": "dk/m", "E": "mk/d"}, "diagram": null, "uncertain": []}, "solution": {"id": 1, "answer": ["A"], "topic": "因次分析與彈簧常數", "insight": "先把題目給的量換成基本因次：間距 d 是長度，質量 m 是質量，彈簧常數 k 可由胡克定律 F=kx 判定因次。聲速必須有速度因次 L/T。", "steps": ["由 F=kx 得 k=F/x。力的因次為 M·L/T²，位移為 L，所以 [k]=M/T²。", "逐一檢查選項。對 A：d√(k/m) 的因次為 L√((M/T²)/M)=L/T，正是速度。", "其餘選項因次分別為：B 是 L·M/T，C 是 √(L·M/(M/T²))=T√L，D 是 L·(M/T²)/M=L/T²，E 是 M²/(L·T²)，皆不是速度。", "因此可能的聲速表示式是 A。因次分析只能篩選形式，不能由此決定數值係數或證明模型的完整物理定律。"], "pitfalls": ["彈簧常數不是力本身；要從 F=kx 得到 [k]=M/T²。", "根號內外都要完整處理因次，不能只比較符號或數字。", "量綱相同是成為答案的必要條件，通常不是充分條件；本題問「可能」所以用來篩選。"], "optionAnalysis": {"A": "正確。因次為 L/T，符合聲速。", "B": "錯誤。因次為 L·M/T，多出質量因次。", "C": "錯誤。因次為 T√L，既非長度/時間，也不是速度因次。", "D": "錯誤。因次為 L/T²，是加速度因次。", "E": "錯誤。因次為 M²/(L·T²)，不是速度。"}, "practice": {"question": "質量為 m 的物體接在彈簧常數為 k 的彈簧上作簡諧振動。只用因次分析，下列哪個量可能表示振動週期？", "options": {"A": "√(m/k)", "B": "√(k/m)", "C": "d√(k/m)，其中 d 是長度", "D": "k/m", "E": "m/k²"}, "answer": ["A"], "steps": ["由 [k]=M/T² 可得 [m/k]=M/(M/T²)=T²，所以 √(m/k) 的因次為時間 T。", "週期必須具有時間因次；B 是 T⁻¹，C 是 L/T，D 是 T⁻²，E 是 T⁴/M，均不符合。", "因次分析只能指出可能的形式，不能決定簡諧振動週期前面的數值係數。"]}, "notes": ["數值係數（例如 2π）沒有因次，因次分析無法決定它。"]}}, {"question": {"number": 2, "type": "single_choice", "source_page": 1, "source_image": "段考1-01.jpg", "stem": "下列關於因次的敘述，何者是正確的？", "choices": {"A": "兩個相同因次的物理量，必定有相同的物理意義", "B": "不同因次的物理量間可以進行加或減的運算", "C": "不同因次的物理量間可以進行乘或除的運算", "D": "等式兩邊的物理量，可能具有不同的因次", "E": "公斤和公斤重具有相同的因次"}, "diagram": null, "uncertain": []}, "solution": {"id": 2, "answer": ["C"], "topic": "物理量因次與運算規則", "insight": "記住因次規則：相加減的量必須同因次，乘除則可以由不同因次的量組合；等式兩邊也必須同因次。再逐項檢查敘述。", "steps": ["兩物理量有相同因次，不代表物理意義相同。例如功和力矩都可寫成 M·L²/T²，但描述的物理概念不同。", "加法與減法要求兩項同因次，否則無法相加成一致的物理量；所以 B 錯。", "不同因次的量可以相乘或相除，例如距離除以時間得到速度；所以 C 正確。", "物理等式兩側必須因次相同，因此 D 錯。", "公斤（kg）是質量單位，因次 M；公斤重（kgf）是力的單位，因次 M·L/T²，兩者不同，因此 E 錯。"], "pitfalls": ["相同因次不等於相同物理意義，因次只能指出量的種類尺度。", "不要把「不同因次不能直接相加」誤推成「不同因次不能相乘或相除」。", "公斤是質量單位；公斤重是力，不能因名稱相似就當成同一因次。"], "optionAnalysis": {"A": "錯誤。相同因次的物理量仍可有不同物理意義，例如功與力矩。", "B": "錯誤。直接相加減必須同因次，例如長度不能直接加時間。", "C": "正確。乘除可組成新因次，例如位移/時間為速度。", "D": "錯誤。物理等式左右因次必須一致，否則等式不可能成立。", "E": "錯誤。kg 的因次是 M；kgf 的因次是力，即 M·L/T²。"}, "practice": {"question": "下列敘述何者正確？", "options": {"A": "位移與時間可以直接相加，因為兩者都是物理量", "B": "速度與加速度因次不同，因此不能相除", "C": "功與力矩因次相同，所以物理意義相同", "D": "長度除以時間可以形成速度", "E": "等式兩邊可以分別是長度與面積"}, "answer": ["D"], "steps": ["長度因次為 L、時間因次為 T，兩者相除得 L/T，這正是速度因次。", "A 違反相加減規則；B 忽略乘除可以組合不同因次；C 混淆因次與物理意義；E 違反等式兩邊因次一致。"]}, "notes": ["無因次量也可以參與乘除，例如 sin 的輸入必須是無因次量。"]}}, {"question": {"number": 4, "type": "single_choice", "source_page": 1, "source_image": "段考1-01.jpg", "stem": "某物體作等速度運動時，下列敘述何者錯誤？", "choices": {"A": "物體運動的軌跡必為直線", "B": "物體的平均速度必等於任何時刻的瞬時速度", "C": "物體必作等速率運動", "D": "等速圓周運動屬於等速度運動的一種", "E": "位移量值必等於路徑長"}, "diagram": null, "uncertain": []}, "solution": {"id": 4, "answer": ["D"], "topic": "等速度運動與速度向量", "insight": "「等速度」指速度向量不變，包含大小和方向都固定。先和「等速率」區分，再檢查每個敘述是否符合速度向量固定。", "steps": ["等速度代表速度大小與方向皆不變，因此物體的運動方向固定，軌跡為直線，A 正確。", "速度向量固定時，任一時間區間的平均速度等於該固定速度，也等於各時刻的瞬時速度，B 正確。", "速度大小不變，所以必為等速率運動，C 正確。", "等速圓周運動雖然速率固定，但速度方向隨位置改變，因此速度向量不固定，不屬於等速度運動。D 是錯誤敘述，符合題目要求。", "直線上保持同方向運動時，位移量值等於路徑長，E 正確。"], "pitfalls": ["本題問「何者錯誤」，答案要選不正確的敘述 D。", "等速率只要求速度大小不變；等速度還要求方向不變。圓周運動是常見的等速率但非等速度例子。", "速度方向若反轉，即使速率大小相同，速度向量仍改變。"], "optionAnalysis": {"A": "正確。速度向量固定表示方向固定，物體沿直線運動。", "B": "正確。固定速度向量在任意時間區間的平均速度仍等於該向量。", "C": "正確。速度向量不變時，其大小也不變，因此速率固定。", "D": "錯誤（本題答案）。等速圓周運動的速率固定，但速度方向持續改變。", "E": "正確。沿固定方向的直線運動沒有折返，位移量值等於路徑長。"}, "practice": {"question": "一輛車以固定速率沿圓形跑道行駛，恰好完成一整圈。關於這一圈的平均速度與平均速率，下列何者正確？", "options": {"A": "平均速度為零，平均速率也為零", "B": "平均速度不為零，平均速率為零", "C": "平均速度為零，平均速率不為零", "D": "平均速度與平均速率都等於瞬時速度", "E": "平均速度和平均速率必定大小相等"}, "answer": ["C"], "steps": ["走完一整圈後回到出發點，總位移為零，所以平均速度（位移除以時間）為零。", "車子確實走過一段非零的圓周路徑，因此路徑長除以時間為正，平均速率不為零。", "此例顯示平均速度是向量、平均速率是純量；固定速率不代表速度向量固定。"]}, "notes": ["向量相等必須同時比較大小與方向；只比大小是在比較速率。"]}}, {"question": {"number": 14, "type": "single_choice", "source_page": 2, "source_image": "段考1-02.jpg", "stem": "初速為零的自由落體，其離地高度 h 與時間 t 之函數關係，下列何者最正確？", "choices": {"A": "圖示 h 起初近乎水平，之後下降愈來愈陡，至 h=0", "B": "圖示 h 起初下降較陡，之後趨平（斜率絕對值逐漸減小），至 h=0", "C": "圖示 h 隨 t 線性遞減至 h=0", "D": "圖示 h 隨 t 遞減並逐漸趨平，停在正高度附近", "E": "圖示 h 隨 t 線性遞增"}, "diagram": "附 A–E 五個 h-t 示意圖，橫軸 t、縱軸 h，無數值刻度；A 起初近乎水平而後下降愈來愈陡，B 起初較陡而後趨平，C 為直線遞減，D 遞減後趨平並停在正高度附近，E 由原點線性遞增。", "uncertain": []}, "solution": {"id": 14, "answer": ["A"], "topic": "自由落體的高度—時間圖", "insight": "先判斷高度 h 對時間的斜率代表什麼：斜率是鉛直速度。初速為零表示圖線起點切線水平；之後向下速度愈來愈大，所以斜率愈來愈負、圖線愈來愈陡。", "steps": ["取向上為正方向，物體從高度 h₀ 靜止落下，鉛直加速度為 −g。", "由等加速度位移公式，h(t) = h₀ + 0·t − ½gt² = h₀ − ½gt²，直到碰地 h=0。", "速度是高度對時間的變化率：dh/dt = −gt。t=0 時斜率為 0；時間增加後斜率絕對值逐漸增大，圖線向下彎且愈來愈陡。符合 A。"], "pitfalls": ["不要把「初速為零」誤解成高度一開始不變一段時間；只有起點瞬間斜率為零，之後立刻開始下降。", "高度 h 的二階導數是 −g，因此 h-t 圖凹向下；不要把速度大小增加誤看成斜率絕對值減小。"], "optionAnalysis": {"A": "正確。h=h₀−½gt²，起點斜率為零，之後斜率愈來愈負，下降愈來愈陡。", "B": "錯誤。這表示下降逐漸趨平，等同向下速度的大小減小，與重力使下落速度增加不符。", "C": "錯誤。直線代表高度以固定速率下降；自由落體的速度會隨時間改變。", "D": "錯誤。物體會持續受重力加速並落到地面，不會停在正高度。", "E": "錯誤。物體高度從 h₀ 開始下降，不會由原點線性上升。"}, "practice": {"question": "一顆球從離地 12 m 處以 4 m/s 的初速鉛直向上拋出，取 g=10 m/s²，忽略空氣阻力。以地面為 h=0，球的高度函數及其圖線特徵何者正確？", "options": {"A": "h=12+4t−5t²；起初上升，圖線凹向下，之後到達地面", "B": "h=12−4t−5t²；起初立即下降，圖線凹向上", "C": "h=12+4t−10t²；起初上升，圖線凹向下", "D": "h=12+4t；以固定速度上升", "E": "h=12−5t²；起初高度對時間的斜率為零"}, "answer": ["A"], "steps": ["取向上為正，初始高度 h₀=12 m、初速 v₀=4 m/s、加速度 a=−10 m/s²。", "代入 h=h₀+v₀t+½at²，得 h=12+4t−5t²。", "初始斜率 dh/dt=4 m/s，故球先上升；二階導數為 −10 m/s²，圖線凹向下，之後速度轉為向下並落地。選 A。"]}, "notes": []}}, {"question": {"number": 16, "type": "single_choice", "source_page": 3, "source_image": "段考1-03.jpg", "stem": "某一雜技表演者用五顆相同的小球做單手拋球表演，由同一高度依次將各球略微偏離鉛直方向、向上拋出，當球回到原本被拋出的高度時，以同一隻手將球接住，然後水平移動到拋出點，再拋出，如圖所示的逆時針軌跡。每次拋球的時間間隔固定為 τ，初速的鉛直分量皆為 v₀，各球的運動軌跡相同，形成連續的循環。過程中，在空中而不在手中的球至少有四顆。假設重力加速度的量值為 g，且空氣阻力可忽略，則下列選項何者正確？", "choices": {"A": "v₀ 可以是 gτ/2", "B": "v₀ 可以是 gτ", "C": "每一小球在空中的時間可以是 3τ", "D": "小球在最高點時離拋出點的鉛直距離可以是 gτ²/2", "E": "小球在最高點時離拋出點的鉛直距離一定大於 2gτ²"}, "diagram": "五顆球沿同一拋物線軌跡不同時刻的位置示意；球自同一高度向上拋，回到該高度接住並水平移回拋出點。", "uncertain": []}, "solution": {"id": 16, "answer": ["E"], "topic": "等間隔拋球與空中球數的限制", "insight": "把每球在空中的時間 T 與固定拋球間隔 τ 比較。五球循環且至少四球同時在空中，表示每球飛行時間必須超過四個拋球間隔；再用對稱上拋的 T=2v₀/g 連到最高高度。", "steps": ["設每次拋球相隔 τ，單球從拋出到回到原高度的飛行時間為 T。五球循環中，若要至少四球始終在空中，就不能讓接球後空中球數降到三球；因此須有 T>4τ。", "嚴格條件是 T>4τ。若 T=4τ，最早的一球正要被接住時，另一球也到了拋出時刻，但兩件事發生在不同位置；單手需從接球處移到拋出點，無法同時完成，因此要留出正的移手時間，T 必須大於 4τ。", "同高度拋出並回到原高度，T=2v₀/g，所以 T>4τ 推得 v₀>2gτ。", "最高點相對拋出點的高度 H=v₀²/(2g)，故 H>(2gτ)²/(2g)=2gτ²。只有 E 必定成立。"], "pitfalls": ["把五顆球的總數直接當成飛行時間是 5τ；至少四顆同時在空中對應的是至少四個拋球間隔。", "T=2v₀/g 只適用於回到拋出高度；若落點高度不同，需另用位移方程。", "嚴格的 T>4τ 依賴接球後移手需正時間的題意假設；忽略接球和移手的時間，會把邊界條件誤寫成 ≥。"], "optionAnalysis": {"A": "不成立。若 v₀=gτ/2，則 T=τ，無法讓至少四球同時在空中。", "B": "不成立。若 v₀=gτ，則 T=2τ，空中球數不足四球。", "C": "不成立。T=3τ 小於所需的 T>4τ。", "D": "不成立。若 H=gτ²/2，則 v₀=gτ、T=2τ，仍不符合球數條件。", "E": "正確。由 T>4τ 得 v₀>2gτ，再得最高高度 H>2gτ²。"}, "practice": {"question": "表演者改用四顆球循環拋接，每隔 τ 秒拋出一球，且任何時刻都至少有三顆球在空中。每球回到拋出高度後由手接住，需正時間移手再拋；忽略空氣阻力。若初速鉛直分量為 v₀，最高點高度 H 必須符合哪一項？", "options": {"A": "H>9gτ²/8", "B": "H=9gτ²/8", "C": "H>2gτ²", "D": "H<9gτ²/8", "E": "條件不足，無法限制 H"}, "answer": ["A"], "steps": ["四球中至少三球同時在空中，且接球後移手需正時間，因此飛行時間 T>3τ。", "同高度上拋的 T=2v₀/g，所以 v₀>3gτ/2。", "H=v₀²/(2g)>(3gτ/2)²/(2g)=9gτ²/8，故選 A。"]}, "notes": ["以等間隔拋球的循環狀態推論球數下限，並採用題幹「接住後水平移動到拋出點，再拋出」代表移手時間為正，故飛行時間門檻為嚴格大於。若題目另明定接球和再拋可在同一瞬間完成，邊界情況可能改為等號；原題未量化移手時間，這項假設已在解題中明示。"]}}, {"question": {"number": 17, "type": "single_choice", "source_page": 3, "source_image": "段考1-03.jpg", "stem": "一車廂的天花板上有一 P 點，其正下方的地板上為 Q 點，兩點的垂直距離為 3 m。該車廂以固定的水平速度 v 往右直線前進，如圖所示。在某時刻，一小球甲從 P 點相對於車廂自靜止自由落下，當甲球下降至與 P 點的垂直距離為 1 m 時，另一顆小球乙也從 P 點相對於車廂自靜止自由落下。若空氣阻力可忽略，當甲球恰落於車廂地板瞬間，下列敘述何者正確？", "choices": {"A": "甲球落於 Q 點，此時兩球高度差的量值大於 1 m", "B": "甲球落於 Q 點，此時兩球高度差的量值等於 1 m", "C": "甲球落於 Q 點，此時兩球高度差的量值小於 1 m", "D": "甲球落於 Q 點左方，此時兩球高度差的量值大於 1 m", "E": "甲球落於 Q 點左方，此時兩球高度差的量值等於 1 m"}, "diagram": "車廂向右；天花板 P 與正下方地板 Q 以虛線標示，垂直距離 3 m。", "uncertain": []}, "solution": {"id": 17, "answer": ["A"], "topic": "等速車廂中的自由落體與相對高度", "insight": "在等速車廂內看，兩球落下時沒有水平相對位移，都會落在 P 正下方的 Q。用甲球的兩段落下時間求乙球開始下落後的時間，再比較兩球的落下距離。", "steps": ["車廂作等速直線運動，可視為慣性參考系。甲、乙相對車廂初速皆為零，且只受重力，所以水平位置不變；甲落地時位於 Q。", "先用直覺比較：乙釋放時，甲已經向下運動；之後兩球都只受重力，向下加速度相同，所以甲相對乙的向下速度維持為正，兩球高度差會從 1 m 繼續增加。接著用時間與位移算出確切差值。", "設甲從 P 落到 Q 的總時間為 T。落下 3 m：3=½gT²，所以 T=√(6/g)。", "甲落下 1 m 時乙才開始落下，所經時間 t₁=√(2/g)。因此到甲落地時，乙已下落的時間為 T−t₁=(√6−√2)/√g。", "乙的落下距離為 ½g(T−t₁)²=½(√6−√2)²=4−2√3 m。此時甲已下降 3 m，故兩球高度差為 3−(4−2√3)=2√3−1≈2.464 m，大於 1 m。", "因此甲落在 Q，兩球高度差大於 1 m，選 A。"], "pitfalls": ["車廂雖然在地面參考系中移動，但兩球開始時都隨車廂具有相同水平速度；相對車廂看，它們的水平速度為零。", "乙不是在甲拋下時同時開始落下；要扣除甲先落下 1 m 所用的時間。", "高度差應比較甲、乙各自的落下距離，不能把乙已下落的距離直接當成兩球高度差。"], "optionAnalysis": {"A": "正確。兩球皆保持相對車廂的水平位置，甲落於 Q；高度差 2√3−1≈2.464 m，大於 1 m。", "B": "錯誤。甲確實落於 Q，但高度差不是 1 m；乙在甲落地前已多下落一段距離。", "C": "錯誤。甲落於 Q，但計算所得高度差約 2.464 m，大於 1 m。", "D": "錯誤。甲相對車廂沒有水平位移，不會落在 Q 左方。", "E": "錯誤。甲不會落在 Q 左方，而且高度差也不等於 1 m。"}, "practice": {"question": "等速向右行駛的車廂中，天花板 P 到地板正下方 Q 的距離改為 5 m。小球甲自 P 相對車廂靜止落下；當甲下降 1 m 時，小球乙才自 P 相對車廂靜止落下。忽略空氣阻力。甲落到地板時，甲的位置及兩球高度差為何？", "options": {"A": "甲在 Q；高度差為 2√5−1 m，約 3.47 m", "B": "甲在 Q 左方；高度差為 2√5−1 m", "C": "甲在 Q；高度差為 1 m", "D": "甲在 Q；高度差為 5 m", "E": "甲在 Q 右方；高度差為 3.47 m"}, "answer": ["A"], "steps": ["車廂等速，兩球相對車廂的水平速度皆為零，所以甲落在 Q。", "甲落下 5 m 的總時間 T=√(10/g)；甲落下 1 m 時乙開始落下，該時刻 t₁=√(2/g)。", "乙的落下距離為 ½g(T−t₁)²=½(√10−√2)²=6−2√5 m。", "甲落地時兩球高度差=5−(6−2√5)=2√5−1≈3.47 m，故選 A。"]}, "notes": []}}, {"question": {"number": 18, "type": "single_choice", "source_page": 3, "source_image": "段考1-03.jpg", "stem": "附圖為某一紙張的長度 Y 與寬度 X 的測量，若長度的測量結果為 (25 ± 0.5) cm，寬度的測量結果為 (20 ± 0.2) cm，則紙張面積的 A 類不確定度為多少？（已知 √3 = 1.73205…、√5 = 2.23606…）", "choices": {"A": "12 cm²", "B": "4.56 cm²", "C": "2.4 cm²", "D": "1.25 cm²", "E": "0.59 cm²"}, "diagram": "長方形紙張示意；水平標示 X ± u(X)，垂直標示 Y ± u(Y)。", "uncertain": []}, "solution": {"id": 18, "answer": ["A"], "topic": "不確定度傳遞：乘積的合成不確定度", "insight": "看到面積是長與寬的乘積，而且兩個量都有不確定度，先辨認這是乘法的不確定度傳遞。面積的相對合成不確定度用平方和開根號，再乘回面積。", "steps": ["把紙張面積寫成 A = XY。中心值為 A = 25 × 20 = 500 cm²。", "長度與寬度的不確定度分別是 u(Y) = 0.5 cm、u(X) = 0.2 cm。對乘積使用合成不確定度公式：u(A) = √[(Y·u(X))² + (X·u(Y))²]。", "代入數值：u(A) = √[(25×0.2)² + (20×0.5)²] cm² = √(5² + 10²) cm² = √125 cm² = 5√5 cm²。", "用題目提供的 √5 ≈ 2.236，得到 u(A) ≈ 11.18 cm²。一般四捨五入到整數會是 11 cm²，原題沒有精確相符的選項；A 的 12 cm² 是最接近的選項，可能是命題意圖，但題目未明定向上取整。"], "pitfalls": ["不要把面積的不確定度直接算成 0.5×0.2；乘積的變化還會受到原本長、寬大小影響。", "不要把兩個方向的最大誤差直接相加當成合成不確定度。本題採用平方和開根號的合成規則。", "計算值約 11.18 cm²，不等於 12 cm²；四捨五入至整數為 11。原題選項沒有精確答案，A 只是最接近的選項，不能說成一般取整後的結果。"], "optionAnalysis": {"A": "12 cm²。它是最接近計算值 11.18 cm² 的選項，但不是精確值，也不是四捨五入到整數的結果（四捨五入為 11 cm²）；題目未說明向上取整。", "B": "4.56 cm²。與乘積的不確定度傳遞結果不符，常見原因是只套用相對不確定度或算術時混用了量值。", "C": "2.4 cm²。通常是只得到一個相對不確定度百分比，卻沒有乘回 500 cm²，或漏掉一項貢獻。", "D": "1.25 cm²。這不是兩個尺寸誤差傳遞到面積後的結果；可能把誤差量相乘或錯誤縮放。", "E": "0.59 cm²。明顯小於單是長度誤差造成的面積變動量 20×0.5=10 cm²，因此不合理。"}, "practice": {"question": "一張長方形卡紙的長為 (20.0 ± 0.4) cm、寬為 (15.0 ± 0.4) cm。若兩項測量的不確定度彼此獨立，卡紙面積的合成不確定度為多少？", "options": {"A": "10 cm²", "B": "14 cm²", "C": "0.12 cm²", "D": "8 cm²", "E": "12 cm²"}, "answer": ["A"], "steps": ["設面積 A = XY，使用 u(A)=√[(Y·u(X))²+(X·u(Y))²]。", "代入：u(A)=√[(20.0×0.4)²+(15.0×0.4)²] = √(8²+6²) = √100 = 10 cm²。", "所以精確選 A。注意每一項都要用另一個邊長乘上該邊的不確定度，再平方相加開根號。"]}, "notes": ["原題影像第 3 頁可辨識長 Y=(25±0.5) cm、寬 X=(20±0.2) cm，問面積的 A 類不確定度。依高中常用的獨立量乘積不確定度傳遞公式計算為 √125≈11.18 cm²，原選項沒有精確相符值；A 的 12 cm² 是最接近選項，可能為命題意圖，但一般四捨五入到整數是 11 cm²，題目也未明定向上取整，因此保留此選項疑義。題目沒有另給重複測量資料，這裡按題目提供的兩個 ± 不確定度作合成傳遞計算。"]}}, {"question": {"number": 20, "type": "single_choice", "source_page": 4, "source_image": "段考1-04.jpg", "stem": "一部汽車以等速度 10.0 m/s 沿水平車道前行，駕駛發現前方 24.5 m 處的單車沿同一直線與方向前進，於是立刻煞車而以等加速度 −a 繼續前行。若單車一直以等速度 3.00 m/s 前進，而兩車不會相撞，則 a 至少約需大於下列何者？注：在等速度運動的坐標系中，牛頓運動定律都能成立。", "choices": {"A": "(10.0)²/(2×24.5) m/s² ≈ 2.04 m/s²", "B": "[(10.0)²−(3.00)²]/(2×24.5) m/s² = 1.86 m/s²", "C": "(10.0−3.00)²/(2×24.5) m/s² = 1.0 m/s²", "D": "[(10.0)²−2×10.0×3.00]/(2×24.5) m/s² = 0.82 m/s²", "E": "[(10.0)²−2×10.0×3.00]/24.5 m/s² = 1.64 m/s²"}, "diagram": null, "uncertain": []}, "solution": {"id": 20, "answer": ["C"], "topic": "相對運動與等加速度運動", "insight": "先改到單車的等速座標系，單車靜止；汽車相對單車的初速是 10.0−3.00=7.00 m/s，煞車加速度大小為 a。比較相對停止距離和初始間距 24.5 m，並留意恰好接觸不符合「不會相撞」。", "steps": ["選單車作為參考系。因為單車等速前進，這仍是慣性座標系，牛頓運動定律可直接使用。", "煞車瞬間，汽車相對單車的速度為 v₀=10.0−3.00=7.00 m/s；汽車相對單車的加速度為 −a，兩車初始距離為 24.5 m。", "相對速度降到零前，汽車追近單車的距離由 v²=v₀²+2aₓΔx 得 Δx=7.00²/(2a)=49.0/(2a)。", "要不發生碰撞，追近距離必須嚴格小於 24.5 m：49.0/(2a)<24.5，因此 a>49.0/49.0=1.00 m/s²。", "若 a=1.00 m/s²，汽車恰在追近 24.5 m 時才與單車相對停止，兩車在該瞬間已接觸；故須大於 1.00 m/s²，對應選項 C。"], "pitfalls": ["相對初速要用兩車速度差 10.0−3.00=7.00 m/s，不能把汽車對地速度 10.0 m/s 直接代入。", "比較的是相對停止距離；單車仍在前進，所以不應把汽車停止所需的對地距離和 24.5 m 直接比較。", "「不會相撞」要求追近距離小於間距。等號代表恰好接觸，門檻是 a>1.00 m/s²，不是 a≥1.00 m/s²。"], "optionAnalysis": {"A": "把單車當成靜止，卻仍使用汽車對地的 10.0 m/s 作初速，忽略了單車也以 3.00 m/s 前進。", "B": "使用速度平方差的形式，像是兩車相對速率可用此式直接處理；但正確的相對初速應為 7.00 m/s，所需減速度門檻為 7.00²/(2×24.5)=1.00 m/s²。", "C": "正確。相對初速 7.00 m/s 的停止距離小於 24.5 m，要求 a>7.00²/(2×24.5)=1.00 m/s²。", "D": "分子 10.0²−2×10.0×3.00 不是本題相對運動的速度平方；改用相對初速後，分子應為 (10.0−3.00)²=49.0。", "E": "除了分子不是相對初速平方，等加速度位移式的分母也應含 2；此式得到的 1.64 m/s² 不適用。"}, "practice": {"question": "一輛汽車以 12.0 m/s 沿直線追近前方 32.0 m、以 4.00 m/s 同方向等速行駛的腳踏車。汽車立刻以大小為 a 的固定減速度煞車。若兩車不能接觸，a 必須滿足哪一條件？", "options": {"A": "a≥2.25 m/s²", "B": "a>1.00 m/s²", "C": "a=1.00 m/s²", "D": "a<1.00 m/s²", "E": "a>2.25 m/s²"}, "answer": ["B"], "steps": ["以腳踏車為參考系，汽車相對初速為 12.0−4.00=8.00 m/s，初始間距為 32.0 m。", "汽車相對腳踏車的停止距離為 8.00²/(2a)=32.0/a。", "不能接觸要求 32.0/a<32.0，因此 a>1.00 m/s²，答案為 B。等於 1.00 m/s² 時恰好接觸。"]}, "notes": ["本題答案為 C。臨界值是 1.00 m/s²，但因題目要求兩車不相撞，實際條件是嚴格大於臨界值。"]}}, {"question": {"number": 23, "type": "multiple_choice", "source_page": 4, "source_image": "段考1-04.jpg", "stem": "一石塊垂直上拋後自由落下，如果不計空氣阻力，則下列敘述哪些正確？（應選 2 項）", "choices": {"A": "石塊在上飛行時和向下掉落時的加速度都是一樣大小，且方向相同", "B": "石塊在上飛行時和向下掉落時的加速度都是一樣大小，但方向相反", "C": "石塊在上飛行到最高點時，其速度和加速度皆為零", "D": "石塊在上飛行到最高點時，其速度和加速度不為零", "E": "石塊在上飛行到最高點時，其速度為零，但加速度不為零"}, "diagram": null, "uncertain": []}, "solution": {"id": 23, "answer": ["A", "E"], "topic": "鉛直上拋與自由落體", "insight": "先把加速度和速度分開判斷：忽略空氣阻力時，石塊全程只受重力，加速度始終向下且大小為 g；最高點只會讓瞬時速度變成零，不會讓重力消失。", "steps": ["忽略空氣阻力後，石塊在上升、最高點和下降期間都只受向下的重力，因此加速度大小全程為 g、方向全程向下。", "所以石塊上升與下降時，加速度大小相同且方向相同，A 正確；B 說方向相反，錯誤。", "到達最高點的瞬間，石塊的鉛直速度由向上減至零，再改為向下；但重力仍然存在，故加速度仍向下、大小為 g。", "因此最高點速度為零而加速度不為零，E 正確；C、D 都把速度或加速度判錯。答案是 A、E。"], "pitfalls": ["最高點的速度為零只描述那一瞬間的運動狀態，不代表石塊停止受力或加速度為零。", "上升和下降時速度方向相反，但加速度方向不變；加速度方向由合力決定，不由運動方向決定。", "此題有兩個正確選項，需選完整集合 A、E。"], "optionAnalysis": {"A": "正確。上升和下降時都只有重力作用，加速度大小皆為 g，方向皆向下。", "B": "錯誤。速度方向雖在上升和下降時相反，加速度卻始終向下，沒有反向。", "C": "錯誤。最高點速度為零，但重力加速度仍是向下的 g，不是零。", "D": "錯誤。最高點的瞬時速度為零；只有加速度不為零。", "E": "正確。最高點速度為零，但加速度仍向下，大小為 g。"}, "practice": {"question": "忽略空氣阻力，將小球垂直向上拋出。以向上為正方向，關於小球到達最高點的瞬間及其前後，下列哪些正確？（應選 2 項）", "options": {"A": "最高點的速度為 0，加速度為 −g", "B": "最高點的速度與加速度都為 0", "C": "上升時加速度為 −g，下降時加速度為 +g", "D": "最高點前後的加速度大小都是 g，方向向下", "E": "小球在最高點停留一段時間後才開始下落"}, "answer": ["A", "D"], "steps": ["設定向上為正，重力全程向下，因此加速度全程 a=−g。", "最高點是速度由正轉負的瞬間，所以該瞬間 v=0，但 a=−g；A 正確。", "最高點前後加速度仍同為向下、大小 g，D 正確。B、C 把加速度方向判錯，E 誤以為物體會停留一段時間。"]}, "notes": ["本題答案為 A、E。速度描述位置變化的快慢與方向；加速度描述速度如何改變。最高點的速度瞬間為零，重力加速度仍存在。"]}}, {"question": {"number": 24, "type": "multiple_choice", "source_page": 4, "source_image": "段考1-04.jpg", "stem": "有一以 32 m/s 等速上升的氣球，離地面 117 m 高處，於氣球上自由落下一小石頭，但氣球仍保持等速運動。則下列關於小石頭的敘述哪些正確？（設 g = 10 m/s²）（應選 3 項）", "choices": {"A": "離開氣球後，15 s 末著地", "B": "離開氣球後，9 s 末著地", "C": "著地時，速度量值為 58 m/s", "D": "石頭自離開氣球到著地期間，氣球視石頭作自由落體運動", "E": "著地時，氣球的高度為 782 m"}, "diagram": null, "uncertain": []}, "solution": {"id": 24, "answer": ["B", "C", "D"], "topic": "鉛直拋射、相對運動與自由落體", "insight": "石頭離開氣球時仍保有氣球向上的 32 m/s 初速。先用地面參考系求落地時間和末速度，再用同一時間算氣球高度；也可檢查石頭相對氣球的運動，確認 D。題目 A、B 的「末」是經過時間，不是「未」著地。", "steps": ["以地面為原點、向上為正。石頭離開氣球時 y₀=117 m、v₀=+32 m/s、a=−10 m/s²。", "落地時 y=0，代入 y=y₀+v₀t−(1/2)gt²：0=117+32t−5t²，整理為 5t²−32t−117=0。", "判別式為 (−32)²−4(5)(−117)=3364=58²，因此 t=(32±58)/10。取正時間，t=9 s；另一根為負，不代表石頭離開氣球後的物理解。", "著地速度 v=v₀−gt=32−10(9)=−58 m/s，方向向下，速度量值為 58 m/s。", "氣球持續以 32 m/s 上升，9 秒後高度為 117+32(9)=405 m。", "在氣球參考系中，石頭初始相對速度為零，相對加速度為 −10 m/s²，所以石頭相對氣球作自由落體運動。故 B、C、D 正確；A 的 15 s 和 E 的 782 m 均不符。"], "pitfalls": ["石頭離開上升氣球時有向上的初速度 32 m/s，不能把它當成由靜止釋放。", "落地時間方程有一正一負兩根，只採用離開氣球後的正時間 9 s。", "末速度有方向，向上為正時 v=−58 m/s；題目問速度量值才寫 58 m/s。", "氣球高度要用氣球本身的等速運動計算，9 秒後是 405 m。", "A、B 的原文是「15 s 末著地」和「9 s 末著地」；「末」表示經過該時間後，不能讀成「未」著地。"], "optionAnalysis": {"A": "錯誤。石頭的高度方程為 117+32t−5t²=0，正根是 9 s，不是 15 s。", "B": "正確。解高度方程取正根，石頭於離開氣球後 9 s 落地。", "C": "正確。落地速度為 32−10×9=−58 m/s，故速度量值為 58 m/s。", "D": "正確。石頭和氣球初始速度相同；以氣球為參考系，石頭初始相對速度為零，向下相對加速度為 g，符合自由落體運動。", "E": "錯誤。9 秒後氣球高度為 117+32×9=405 m，不是 782 m。"}, "practice": {"question": "一個氣球以 20 m/s 等速上升，在離地 60 m 處放開一顆小球。設 g=10 m/s²，忽略空氣阻力。下列敘述哪些正確？（應選 3 項）", "options": {"A": "小球在離開氣球後 2 s 落地", "B": "小球在離開氣球後 6 s 落地", "C": "小球落地時速度量值為 40 m/s", "D": "小球相對氣球以自由落體方式向下運動", "E": "小球落地時氣球離地 140 m"}, "answer": ["B", "C", "D"], "steps": ["以地面為原點、向上為正，小球初始高度 60 m、初速 +20 m/s。令落地時間為 t，則 0=60+20t−5t²，解得正根 t=6 s。", "落地速度 v=20−10×6=−40 m/s，速度量值為 40 m/s，因此 B、C 正確。", "氣球與小球初始速度相同，小球相對氣球初速為零，且相對加速度向下為 g，所以相對氣球作自由落體運動，D 正確。", "氣球 6 秒後高度為 60+20×6=180 m，故 A、E 錯誤。"]}, "notes": ["本題答案為 B、C、D。獨立代入運動方程可得落地時間 9 s、落地速度 −58 m/s、氣球高度 405 m。"]}}];

function nav(){ $('#nav').innerHTML=DATA.map((d,i)=>`<button class="${states[i].correct?'done':''}" data-go="${i}" aria-current="${i===index?'page':'false'}" aria-label="第${d.question.number}題${states[i].correct?'，已完成':''}">${d.question.number}</button>`).join(''); $('#progressText').textContent=`已完成 ${complete()} / ${DATA.length} 題`;$('#overall').textContent=`解題進度 ${complete()} / ${DATA.length}`; }
function graph14(){let specs={A:'M0 0 Q55 0 110 58',B:'M0 0 Q0 58 110 58',C:'M0 0 L110 58',D:'M0 0 Q28 28 65 28 L110 28',E:'M0 58 L110 0'};return `<div class="figure"><svg viewBox="0 0 390 240" role="img" aria-label="五個高度時間關係選項示意圖"><text x="8" y="18" font-size="13">五個 h-t 圖（僅示意，無數值刻度）</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#17283d"/></marker></defs>${Object.entries(specs).map(([k,path],i)=>{let x=10+(i%2)*190,y=28+Math.floor(i/2)*68;return `<g transform="translate(${x},${y})"><path d="M28 0V62H155" fill="none" stroke="#657889" marker-end="url(#arrow)"/><path d="${path}" transform="translate(28,4)" fill="none" stroke="#d85b42" stroke-width="3"/><text x="4" y="18" font-weight="bold">${k}</text><text x="158" y="66">t</text><text x="18" y="4">h</text></g>`}).join('')}</svg><div class="figcaption">依原卷重繪的 A–E 示意圖：A–D 從相同的正高度開始，E 從原點開始；不按比例。</div></div>`}
function diagram(n){if(n===14)return graph14();if(n===16)return `<div class="figure"><svg viewBox="0 0 520 150" role="img" aria-label="五顆球依序拋出與接住的時間間隔示意圖"><path d="M55 65H465" stroke="#7d9ab0" stroke-width="3"/><path d="M55 55V76M465 55V76" stroke="#18324d" stroke-width="3"/>${[[95,'拋球 1'],[175,'拋球 2'],[255,'拋球 3'],[335,'拋球 4'],[415,'拋球 5']].map(([x,t],i)=>`<circle cx="${x}" cy="65" r="13" fill="#d85b42"/><text x="${x-4}" y="70" fill="white" font-size="12">${i+1}</text><text x="${x-26}" y="102" font-size="12">${t}</text>`).join('')}<text x="120" y="32">相鄰拋球時刻間隔皆為 τ</text><text x="56" y="132">時間線示意；球的位置不代表空間軌跡或比例</text></svg><div class="figcaption">新繪時間線：每隔 τ 拋出一球，避免將時間間隔誤讀為空間位置。</div></div>`;if(n===17)return `<div class="figure"><svg viewBox="0 0 480 220" role="img" aria-label="等速車廂中 P 點正下方 Q 點，兩顆球先後自由落下示意"><rect x="55" y="35" width="350" height="145" rx="12" fill="#eef3f6" stroke="#18324d" stroke-width="3"/><path d="M75 55H385M75 160H385" stroke="#18324d" stroke-width="6"/><path d="M230 57V155" stroke="#8096a6" stroke-dasharray="6 5" stroke-width="2"/><circle cx="230" cy="62" r="10" fill="#d85b42"/><circle cx="230" cy="101" r="10" fill="#dfaa48"/><text x="244" y="66">P</text><text x="244" y="158">Q</text><text x="80" y="117">車廂向右 →</text><text x="260" y="93">甲先落下</text><text x="260" y="125">乙後落下</text><path d="M130 199h80m-10-8 10 8-10 8" stroke="#18324d" stroke-width="3"/></svg><div class="figcaption">依原題條件重繪的車廂示意；圖形不按比例。</div></div>`;return ''}
function choices(obj){return `<ul class="choices">${Object.entries(obj).map(([k,v])=>`<li><span class="label">${k}.</span>${esc(v)}</li>`).join('')}</ul>`}
function render(){let d=DATA[index],q=d.question,s=d.solution;revealed=states[index].revealed;nav();let multi=q.type==='multiple_choice';$('#content').innerHTML=`<div class="kicker">第 ${q.number} 題 · ${multi?'多選題':'單選題'} ${multi?'（完整集合判分）':''}</div><h2>${esc(s.topic)}</h2><p class="topic">原題 · ${q.source_page} 頁</p><div class="card"><h3>題目</h3><p class="stem">${esc(q.stem)}</p>${choices(q.choices)}${diagram(q.number)}</div><div class="card"><h3>讀題切入點</h3><p class="hint">${esc(s.insight)}</p></div><div class="card"><h3>逐步推導</h3><div class="progress" aria-label="推導進度"><i id="stepbar"></i></div><ol class="steps">${s.steps.map((st,i)=>`<li class="reveal" data-step="${i}" ${i===0?'':'hidden'}>${esc(st)}</li>`).join('')}</ol><div class="stepnav"><button id="prev" data-action="previous-step" type="button">上一步</button><span id="stepcount" aria-live="polite"></span><button class="action primary" id="next" data-action="next-step" type="button">顯示下一步</button></div><button class="action" id="showall" data-action="show-all-steps" type="button">展開全部推導</button></div><div class="card" id="solutionPanel" hidden><h3>答案與選項分析</h3><p><strong>${q.number===18?'原題選項有疑義：計算值 11.18 cm²；最近選項為 A（12 cm²），非精確相符。':`正確答案：${s.answer.join('、')}`}</strong></p><div class="analysis">${Object.entries(s.optionAnalysis).map(([k,v])=>`<div><b>${k}.</b> ${esc(v)}</div>`).join('')}</div></div><div class="card"><h3>注意事項</h3>${[...s.pitfalls,...s.notes].map(n=>`<p class="note">${esc(n)}</p>`).join('')}</div><section class="quiz" aria-labelledby="quiztitle"><h3 id="quiztitle">變化練習</h3><p>${esc(s.practice.question)}</p><fieldset class="quiz-options"><legend>${multi?'請選出完整答案集合':'選一個答案'}</legend>${Object.entries(s.practice.options).map(([k,v])=>`<label><input type="${multi?'checkbox':'radio'}" name="practice-${q.number}" value="${k}"><span><b>${k}.</b> ${esc(v)}</span></label>`).join('')}</fieldset><button class="action primary" id="grade" data-action="grade-practice" type="button">送出作答</button> <button class="action" id="retry" data-action="retry-practice" type="button">重新作答</button><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="reveal" id="practiceSol" hidden><strong>練習解析</strong><ol>${s.practice.steps.map(st=>`<li>${esc(st)}</li>`).join('')}</ol><p>答案：${s.practice.answer.join('、')}</p></div></section><div class="tools"><button class="action" id="reset" data-action="reset-question" type="button">重設本題</button><button class="action" id="print" type="button">列印本題</button><button class="action all" id="back" type="button">上一題</button><button class="action primary" id="forward" type="button">下一題</button></div><p class="foot">本教材依題目轉錄與解題資料整理；圖示為教學示意。第 18 題計算值與選項差異已明確保留。</p>`;bind(d)}
function updateSteps(){let els=[...document.querySelectorAll('[data-step]')];els.forEach((e,i)=>e.hidden=i>=revealed);$('#stepcount').textContent=`已顯示 ${revealed} / ${els.length} 步`;$('#stepbar').style.width=`${els.length?revealed/els.length*100:0}%`;$('#prev').disabled=revealed<=1;$('#next').disabled=revealed>=els.length;$('#solutionPanel').hidden=revealed<els.length;}
function bind(d){let steps=d.solution.steps.length,state=states[index];updateSteps();document.querySelectorAll('.quiz-options input').forEach(x=>{x.checked=state.chosen.includes(x.value);x.addEventListener('change',saveChoices)});if(state.submitted){$('#practiceSol').hidden=false;$('#feedback').textContent=state.correct?'答對了！可以查看解析，或繼續下一題。':'這次選擇尚未完整符合答案集合，解析已展開；可按重新作答再試一次。';$('#feedback').className='feedback '+(state.correct?'good':'bad')}function saveChoices(){state.chosen=[...document.querySelectorAll('.quiz-options input:checked')].map(x=>x.value)}$('#next').onclick=()=>{revealed=Math.min(steps,revealed+1);state.revealed=revealed;updateSteps()};$('#prev').onclick=()=>{revealed=Math.max(1,revealed-1);state.revealed=revealed;updateSteps()};$('#showall').onclick=()=>{revealed=steps;state.revealed=revealed;updateSteps()};$('#grade').onclick=()=>{saveChoices();let chosen=[...state.chosen].sort(),ans=[...d.solution.practice.answer].sort(),fb=$('#feedback');if(!chosen.length){fb.textContent='請先選擇答案，再送出作答。';fb.className='feedback bad';return}let ok=chosen.join('|')===ans.join('|');state.submitted=true;state.correct=ok;fb.textContent=ok?'答對了！可以查看解析，或繼續下一題。':'這次選擇尚未完整符合答案集合，先回想推導再試一次。';fb.className='feedback '+(ok?'good':'bad');$('#practiceSol').hidden=false;nav()};function clearAttempt(message){state.chosen=[];state.submitted=false;state.correct=false;document.querySelectorAll('.quiz-options input').forEach(x=>x.checked=false);$('#practiceSol').hidden=true;$('#feedback').textContent=message;$('#feedback').className='feedback';nav()}$('#retry').onclick=()=>clearAttempt('已清除作答，請重新思考後再選。');$('#reset').onclick=()=>{revealed=1;state.revealed=1;clearAttempt('');updateSteps()};$('#print').onclick=()=>window.print();$('#back').onclick=()=>go(Math.max(0,index-1));$('#forward').onclick=()=>go(Math.min(DATA.length-1,index+1));}
function go(i){if(i===index)return;index=i;revealed=states[index].revealed;render();window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b)go(Number(b.dataset.go))});document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='ArrowRight')go(Math.min(DATA.length-1,index+1));if(e.altKey&&e.key==='ArrowLeft')go(Math.max(0,index-1))});render();
</script></body></html>
